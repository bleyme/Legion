<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="48" height="72">
  <!-- Helmet -->
  <rect x="4" y="0" width="16" height="9" rx="4" fill="#3a4a30"/>
  <rect x="3" y="6" width="18" height="3" rx="1" fill="#2a3a22"/>
  <!-- Face -->
  <ellipse cx="12" cy="11" rx="6" ry="5" fill="#c8956a"/>
  <!-- Goggles -->
  <rect x="6" y="9" width="4" height="3" rx="1" fill="#1a2a3a" opacity="0.9"/>
  <rect x="14" y="9" width="4" height="3" rx="1" fill="#1a2a3a" opacity="0.9"/>
  <rect x="10" y="10" width="4" height="1" fill="#1a2a3a" opacity="0.6"/>
  <!-- Neck -->
  <rect x="10" y="15" width="4" height="3" fill="#c8956a"/>
  <!-- Body / vest -->
  <rect x="4" y="17" width="16" height="12" rx="2" fill="#4a5a38"/>
  <rect x="6" y="18" width="12" height="9" rx="1" fill="#5a6a48"/>
  <!-- Belt -->
  <rect x="4" y="28" width="16" height="3" rx="1" fill="#2a2010"/>
  <rect x="10" y="28" width="4" height="3" fill="#4a3820"/>
  <!-- Left arm -->
  <rect x="1" y="17" width="4" height="11" rx="2" fill="#4a5a38"/>
  <rect x="0" y="26" width="5" height="4" rx="2" fill="#c8956a"/>
  <!-- Right arm -->
  <rect x="19" y="17" width="4" height="11" rx="2" fill="#4a5a38"/>
  <rect x="19" y="26" width="5" height="4" rx="2" fill="#c8956a"/>
  <!-- Left leg -->
  <rect x="5" y="30" width="6" height="6" rx="1" fill="#3a4a30"/>
  <!-- Left boot -->
  <rect x="4" y="34" width="7" height="3" rx="1" fill="#1a1208"/>
  <!-- Right leg -->
  <rect x="13" y="30" width="6" height="6" rx="1" fill="#3a4a30"/>
  <!-- Right boot -->
  <rect x="13" y="34" width="7" height="3" rx="1" fill="#1a1208"/>
</svg>
