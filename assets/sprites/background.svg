<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="60%" stop-color="#1a2035"/>
      <stop offset="100%" stop-color="#2a3050"/>
    </linearGradient>
    <linearGradient id="moon_glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="1100" cy="90" r="50" fill="#d8d0b0" opacity="0.9"/>
  <circle cx="1118" cy="82" r="46" fill="#1a2035"/>
  <!-- Moon craters -->
  <circle cx="1090" cy="95" r="6" fill="#c8c0a0" opacity="0.5"/>
  <circle cx="1108" cy="108" r="4" fill="#c8c0a0" opacity="0.4"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="340" cy="40" r="1" fill="white" opacity="0.6"/>
  <circle cx="560" cy="80" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="700" cy="30" r="1" fill="white" opacity="0.9"/>
  <circle cx="850" cy="55" r="2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="20" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="980" cy="45" r="1" fill="white" opacity="0.7"/>
  <circle cx="1200" cy="150" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="60" cy="160" r="1" fill="white" opacity="0.6"/>
  <circle cx="780" cy="110" r="1" fill="white" opacity="0.4"/>
  <circle cx="630" cy="140" r="1.5" fill="white" opacity="0.5"/>

  <!-- Distant city silhouette -->
  <!-- Buildings left cluster -->
  <rect x="0" y="440" width="60" height="200" fill="#111828"/>
  <rect x="20" y="400" width="30" height="240" fill="#0e1520"/>
  <rect x="55" y="460" width="40" height="180" fill="#111828"/>
  <rect x="80" y="420" width="25" height="220" fill="#0e1520"/>
  <rect x="100" y="450" width="50" height="190" fill="#111828"/>
  <rect x="140" y="380" width="35" height="260" fill="#0e1520"/>
  <rect x="165" y="430" width="45" height="210" fill="#111828"/>
  <!-- Antenna -->
  <rect x="148" y="360" width="3" height="22" fill="#0e1520"/>
  <rect x="25" y="382" width="2" height="18" fill="#0e1520"/>

  <!-- Buildings right cluster -->
  <rect x="1100" y="450" width="60" height="200" fill="#111828"/>
  <rect x="1130" y="410" width="40" height="240" fill="#0e1520"/>
  <rect x="1160" y="440" width="50" height="210" fill="#111828"/>
  <rect x="1195" y="420" width="40" height="230" fill="#0e1520"/>
  <rect x="1220" y="460" width="60" height="190" fill="#111828"/>
  <rect x="1135" y="394" width="2" height="18" fill="#0e1520"/>

  <!-- Middle distant buildings -->
  <rect x="520" y="490" width="30" height="160" fill="#0f1625" opacity="0.7"/>
  <rect x="545" y="510" width="20" height="140" fill="#111828" opacity="0.7"/>
  <rect x="700" y="480" width="35" height="170" fill="#0f1625" opacity="0.7"/>
  <rect x="728" y="500" width="22" height="150" fill="#111828" opacity="0.7"/>

  <!-- Ground fog -->
  <rect x="0" y="650" width="1280" height="70" fill="#1a2035" opacity="0.4"/>

  <!-- Window lights in buildings -->
  <rect x="30" y="410" width="6" height="4" fill="#f0d060" opacity="0.6"/>
  <rect x="42" y="422" width="6" height="4" fill="#f0d060" opacity="0.4"/>
  <rect x="148" y="395" width="6" height="4" fill="#f0d060" opacity="0.5"/>
  <rect x="160" y="440" width="6" height="4" fill="#80b0f0" opacity="0.5"/>
  <rect x="1140" y="420" width="6" height="4" fill="#f0d060" opacity="0.5"/>
  <rect x="1165" y="450" width="6" height="4" fill="#f0d060" opacity="0.4"/>
  <rect x="1200" y="430" width="6" height="4" fill="#80b0f0" opacity="0.5"/>
</svg>
